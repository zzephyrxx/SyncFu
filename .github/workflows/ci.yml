name: Verify and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    env:
      SYNCFU_RELEASE_PAGE: https://github.com/${{ github.repository }}/releases
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p syncfu-core --all-targets -- -D warnings
      - name: Build SyncFu 0.1.0 and run tests
        run: node scripts/build.mjs ${{ matrix.platform }}
      - name: Package portable Windows build sources
        if: runner.os == 'Windows'
        run: node scripts/package-source.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: SyncFu-0.1.0-${{ matrix.platform }}
          if-no-files-found: error
          path: releases/0.1.0/
