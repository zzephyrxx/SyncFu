name: Bug report / 问题反馈
description: Report a reproducible issue without exposing private data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "安全漏洞请先阅读 SECURITY.md。不要上传配对码、密钥、应用数据库、备份或真实文件正文；路径和设备名请脱敏。"
  - type: checkboxes
    id: checklist
    attributes:
      label: Before reporting / 提交前
      options:
        - label: I checked existing issues / 我已检查已有问题
          required: true
        - label: This report contains no credentials or private file contents / 不包含凭据或私人文件正文
          required: true
  - type: input
    id: revision
    attributes:
      label: Revision or build ID / 版本或构建 ID
      placeholder: 0.1.0, commit SHA, or artifact name
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 运行环境
      description: List both peers if relevant; OS version, CPU architecture, SyncFu version, native app or browser fixture.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Use synthetic files and temporary directories, not private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
      description: Include task direction and whether changes were additions, updates, deletions or conflicts.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized logs or screenshots / 脱敏日志或截图
      description: Share only relevant excerpts. If data loss is suspected, stop writes and preserve stage/backup data; do not attach those directories here.
